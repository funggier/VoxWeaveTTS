<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxWeaveTTS · Subtitle Overlay</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{display:flex;align-items:flex-end;justify-content:center;font-family:"Noto Sans Thai","Segoe UI",Tahoma,sans-serif}
#subtitle{
  width:calc(100% - 50px);
  margin:0 20px 35px;
  color:white;
  text-align:center;
  font-size:clamp(22px,3.3vw,54px);
  font-weight:700;
  line-height:1.45;
  white-space:pre-line;
  /* Native Thai line breaking, rather than arbitrarily splitting vowels or codas. */
  overflow-wrap:normal;
  word-break:normal;
  line-break:auto;
  text-shadow:0 2px 5px rgba(0,0,0,.98),0 0 15px rgba(0,0,0,.88);
}
#subtitle:empty{display:none}
</style>
</head>
<body>
<div id="subtitle" role="status" aria-live="off"></div>
<script>
"use strict";
const subtitle=document.getElementById("subtitle");
const query=new URLSearchParams(location.search);
const mode=["segment","estimated","activity","manual"].includes(query.get("mode")) ? query.get("mode") : "segment";
const modeQuery="?mode="+mode;
let streamConnected=false;
let inFlight=false;
let lastRevision=-1;
function showState(state){
  if(!state || !Number.isInteger(state.revision))return;
  if(state.revision<lastRevision)return;
  lastRevision=state.revision;
  const caption=state.state==="playing"&&!state.stale ? state.subtitle : "";
  // Never use innerHTML: captions may contain quotes, emoji and markup.
  if(subtitle.textContent!==caption)subtitle.textContent=caption;
}
async function pollFallback(){
  if(streamConnected||inFlight)return;
  inFlight=true;
  try{
    const response=await fetch("/v1/playback/state"+modeQuery,{cache:"no-store"});
    if(!response.ok)throw new Error("playback unavailable");
    showState(await response.json());
  }catch{
    subtitle.textContent="";
  }finally{inFlight=false;}
}
if(typeof EventSource!=="undefined"){
  const stream=new EventSource("/v1/playback/stream"+modeQuery);
  // A server restart resets its in-memory revision counter.
  stream.onopen=()=>{lastRevision=-1;};
  stream.addEventListener("playback",event=>{
    try{showState(JSON.parse(event.data));streamConnected=true;}
    catch{streamConnected=false;}
  });
  stream.onerror=()=>{streamConnected=false;};
}
pollFallback();
setInterval(pollFallback,1000);
</script>
</body>
</html>
