<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxWeaveTTS · Subtitle Overlay</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{display:flex;align-items:flex-end;justify-content:center;font-family:"Noto Sans Thai","Segoe UI",Tahoma,sans-serif}
#subtitle{
  width:calc(100% - 50px);
  margin:0 20px 35px;
  color:white;
  text-align:center;
  font-size:clamp(22px,3.3vw,54px);
  font-weight:700;
  line-height:1.45;
  white-space:pre-line;
  overflow-wrap:anywhere;
  text-shadow:0 2px 5px rgba(0,0,0,.98),0 0 15px rgba(0,0,0,.88);
}
#subtitle:empty{display:none}
</style>
</head>
<body>
<div id="subtitle" role="status" aria-live="off"></div>
<script>
"use strict";
const subtitle=document.getElementById("subtitle");
let lastSequence=null;
let inFlight=false;
async function updateOverlay(){
  if(inFlight)return;
  inFlight=true;
  try{
    const response=await fetch("/v1/playback/state",{cache:"no-store"});
    if(!response.ok)throw new Error("playback state unavailable");
    const state=await response.json();
    // textContent prevents HTML injection from imported fiction/Unicode input.
    const visible=state.state==="playing"&&!state.stale ? state.subtitle : "";
    if(subtitle.textContent!==visible)subtitle.textContent=visible;
    lastSequence=state.sequence;
  }catch{
    // Hide the last subtitle rather than leaving stale speech on screen.
    subtitle.textContent="";
    lastSequence=null;
  }finally{inFlight=false;}
}
updateOverlay();
setInterval(updateOverlay,250);
</script>
</body>
</html>
