name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test (standard library only)
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path (Get-Location) 'src'
          python -m unittest discover -s tests -v
  json-editor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All JavaScript browser smoke tests (no dependencies)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tests = Get-ChildItem tests -Filter "*_smoke.cjs" | Sort-Object Name
          if ($tests.Count -lt 25) { throw "Expected at least 25 smoke tests" }
          foreach ($test in $tests) {
            node $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed: $($test.Name)" }
          }
          Write-Output "PASS JS suites: $($tests.Count)"