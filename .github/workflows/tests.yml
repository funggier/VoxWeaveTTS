name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test (standard library only)
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path (Get-Location) 'src'
          python -m unittest discover -s tests -v
  json-editor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JSON Editor browser smoke (no dependencies)
        shell: pwsh
        run: |
          node tests/json_settings_ui_smoke.cjs
          node tests/ai_settings_ui_smoke.cjs
          node tests/reading_ui_smoke.cjs
          node tests/playback_clock_smoke.cjs
          node tests/overlay_sse_smoke.cjs
          node tests/manual_alignment_ui_smoke.cjs
          node tests/waveform_editor_smoke.cjs
          node tests/mode_workspace_smoke.cjs
          node tests/audio_scheduler_smoke.cjs
          node tests/mode_voices_smoke.cjs
          node tests/mode_inputs_smoke.cjs
          node tests/read_sender_names_smoke.cjs
          node tests/tiktok_live_smoke.cjs
          node tests/model_packages_ui_smoke.cjs
          node tests/live_queue_retention_smoke.cjs
          node tests/source_settings_profile_smoke.cjs
          node tests/source_feed_smoke.cjs
          node tests/discord_client_ui_smoke.cjs