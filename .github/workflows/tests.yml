name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Universal v4's offline wheel installation regression runs uv against
      # a synthetic local wheelhouse. CI must provide uv explicitly rather
      # than assume a particular Windows hosted-runner image includes it.
      - uses: astral-sh/setup-uv@v7
      # Test-only dependencies support offline-wheel metadata and rights audits.
      # Install on both Python ABIs.
      - name: Install test-only audit and signature dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "packaging>=24,<27" "cryptography>=46,<48" "pytest>=8,<10"
      - name: Universal v4-only Python regression tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path (Get-Location) 'src'
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Exercise parametrized HTTP/LAN regressions, not just import them.
          python -m pytest -q tests/test_network_settings_http.py tests/test_remote_network.py tests/test_computer_runtime_http.py tests/test_computer_runtime_live.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  json-editor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All JavaScript browser smoke tests (no dependencies)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tests = Get-ChildItem tests -Filter "*_smoke.cjs" | Sort-Object Name
          if ($tests.Count -lt 25) { throw "Expected at least 25 smoke tests" }
          foreach ($test in $tests) {
            node $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed: $($test.Name)" }
          }
          Write-Output "PASS JS suites: $($tests.Count)"