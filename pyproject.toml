[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "voxweavetts"
version = "0.2.0.dev2"
description = "Portable Thai-first speech and text processing platform, M1 CPU audio preview."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "funggier"}]
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]