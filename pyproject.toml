[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "voxweavetts"
version = "0.12.9"
description = "Thai-first modular TTS with engine-neutral TXT/Markdown reader, speech queue and local WAV API."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "funggier"}]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
signed-providers = ["cryptography>=46,<48"]
youtube-stream = ["grpcio>=1.66,<2", "protobuf>=5,<8"]
kokoro-cpu = ["kokoro-onnx==0.6.0"]
# Kokoro ONNX by itself uses eSpeak for Japanese and spells kanji as
# "Chinese letter"; Japanese voices require model-native Misaki phonemes.
kokoro-ja = ["kokoro-onnx==0.6.0", "misaki[ja]==0.8.0", "unidic-lite==1.0.8"]
multilingual-cpu = ["sherpa-onnx==2.0.1"]

[tool.setuptools.packages.find]
where = ["src"]