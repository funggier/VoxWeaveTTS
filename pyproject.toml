[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "voxweavetts"
version = "0.4.4.dev0"
description = "Thai-first modular TTS with engine-neutral TXT/Markdown reader, speech queue and local WAV API."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "funggier"}]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
youtube-stream = ["grpcio>=1.66,<2", "protobuf>=5,<8"]

[tool.setuptools.packages.find]
where = ["src"]