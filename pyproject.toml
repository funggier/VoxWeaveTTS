[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "voxweavetts"
version = "0.3.0.dev0"
description = "Thai-first modular TTS with engine-neutral speech job queue and local WAV API."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "funggier"}]
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]